name: Go validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      LAB_INTEGRATION: "0"
      LAB_E2B_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Release gate formatting, vet and race tests
        run: |
          bash -n scripts/verify.sh
          ./scripts/verify.sh unit
      - name: Build static sandbox task helper
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/agentlab-task-agent ./cmd/e2b-task-agent
